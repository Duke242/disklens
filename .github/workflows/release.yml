name: Release

# Push a tag like v0.1.0 to build installers for every platform and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-24.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: DiskLens v__VERSION__
          releaseBody: |
            Download the installer for your system below.

            | System | File |
            |---|---|
            | macOS, Apple Silicon (M1 and newer) | `DiskLens_*_aarch64.dmg` |
            | macOS, Intel | `DiskLens_*_x64.dmg` |
            | Windows | `DiskLens_*_x64-setup.exe` or `.msi` |
            | Linux | `.AppImage` (any distro), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora) |

            These builds aren't code-signed yet, so your OS will warn the first time. See [Installing](https://github.com/Duke242/disklens#installing) for the one-time steps.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
