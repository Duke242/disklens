[package]
name = "disklens"
version = "0.1.0"
description = "See where your disk space and RAM actually go"
authors = ["Duke242"]
license = "MIT"
edition = "2021"

[lib]
name = "disklens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"

[profile.release]
lto = true
codegen-units = 1
strip = true
